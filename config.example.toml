# Optional persistent touchpad selector.
#
# Prefer vendor/product (and optionally name) over /dev/input/eventX because event
# numbers may change after a reboot. Fields are combined with AND.
#
# Find the suggested values with:
#   trackpadd devices
#
# Uncomment and replace these values with your own touchpad:
#
# [device]
# vendor = 0x04f3
# product = 0x3140
# name = "Example Touchpad"

# The gesture starts only when a new finger contact appears inside the edge zone.
# width = 0.06 means the outer 6% of the physical trackpad.

[[gestures]]
id = "right-edge"
type = "edge-swipe"
edge = "right"
width = 0.06
cancel_margin = 0.04

[[gestures]]
id = "left-edge"
type = "edge-swipe"
edge = "left"
width = 0.06
cancel_margin = 0.04

# Optional horizontal swipe that must start inside the top edge zone.
# Positive delta means moving right; negative delta means moving left.
#
# [[gestures]]
# id = "top-edge"
# type = "edge-swipe"
# edge = "top"
# width = 0.06
# cancel_margin = 0.10

# MVP backend: brightnessctl. Keep a non-zero minimum while experimenting.
[[actions]]
id = "screen-brightness"
type = "brightness"
command = "brightnessctl"
min = 0.05
max = 1.0

# MVP backend: wpctl (WirePlumber/PipeWire).
[[actions]]
id = "speaker-volume"
type = "volume"
command = "wpctl"
min = 0.0
max = 1.0

# Optional continuous media scrubbing through playerctl/MPRIS.
# Intended for a horizontal top-edge gesture.
#
# [[actions]]
# id = "media-position"
# type = "media-seek"
# command = "playerctl"
# seconds_per_full_swipe = 60
# update_interval_ms = 50
# deadzone = 0.025
# curve = 1.4
#
# [[bindings]]
# gesture = "top-edge"
# action = "media-position"
# sensitivity = 1.0
# invert = false


# Generic one-shot command action.
#
# Commands are executed directly, without an implicit shell. Use `args` for
# arguments. If shell syntax is really needed, invoke a shell explicitly, for
# example command = "sh" and args = ["-c", "..."].
#
# The default trigger is "end": the command runs only when the gesture ends
# normally and the transformed delta reaches `threshold` at least once.
#
# direction can be "any", "up", "down", "left", or "right". `sensitivity` and `invert` from the
# binding are applied before this threshold/direction check.
#
# [[actions]]
# id = "lock-session"
# type = "command"
# command = "loginctl"
# args = ["lock-session"]
# trigger = "end"
# direction = "any"
# threshold = 0.10
#
# [[bindings]]
# gesture = "right-edge"
# action = "lock-session"
# sensitivity = 1.0
# invert = false

# Moving upward produces a positive delta, so both values increase.
[[bindings]]
gesture = "right-edge"
action = "screen-brightness"
sensitivity = 1.20

[[bindings]]
gesture = "left-edge"
action = "speaker-volume"
sensitivity = 1.00
