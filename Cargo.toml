[workspace]
resolver = "2"
members = [
    "crates/trackpad-core",
    "crates/trackpad-linux",
    "crates/trackpadd",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
evdev = "0.13.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
zbus = "5.18.0"
